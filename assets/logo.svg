<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep obsidian studio background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- FFmpeg-homage DCT Zig-Zag Emerald -> Cyan -> Rust Amber gradient -->
    <linearGradient id="zigzagGrad" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="48%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Ragdoll Sapphire Eye Glow -->
    <linearGradient id="sapphireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Card Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>
  <rect x="28" y="28" width="456" height="456" rx="92" stroke="#334155" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Background 4x4 SIMD Register / DCT Frequency Grid -->
  <g stroke="#1E293B" stroke-width="1.5" opacity="0.75">
    <line x1="136" y1="96" x2="136" y2="416"/>
    <line x1="216" y1="96" x2="216" y2="416"/>
    <line x1="296" y1="96" x2="296" y2="416"/>
    <line x1="376" y1="96" x2="376" y2="416"/>
    <line x1="96" y1="136" x2="416" y2="136"/>
    <line x1="96" y1="216" x2="416" y2="216"/>
    <line x1="96" y1="296" x2="416" y2="296"/>
    <line x1="96" y1="376" x2="416" y2="376"/>
  </g>

  <!-- Geometric Ragdoll Cat Outer Faceted Shield (Ears + Cheekbones + Chin) -->
  <path
    d="M 116 92
       L 204 156
       L 308 156
       L 396 92
       L 420 248
       L 356 368
       L 256 428
       L 156 368
       L 92 248 Z"
    fill="#111827"
    fill-opacity="0.82"
    stroke="#334155"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Ear Facets (Rust Orange & Emerald Accents) -->
  <polygon points="130,118 188,160 114,218" fill="#10B981" fill-opacity="0.18"/>
  <polygon points="382,118 324,160 398,218" fill="#F97316" fill-opacity="0.18"/>

  <!-- Iconic 4x4 DCT Zig-Zag Entropy Scan Path (Homage to FFmpeg's Zig-Zag, woven through the Ragdoll mask) -->
  <!-- Coordinates trace a true 4x4 DCT zig-zag scan:
       (0,0)->(1,0)->(0,1)->(0,2)->(1,1)->(2,0)->(3,0)->(2,1)->(1,2)->(0,3)->(1,3)->(2,2)->(3,1)->(3,2)->(2,3)->(3,3) -->
  <path
    d="M 136 136
       L 216 136
       L 136 216
       L 136 296
       L 216 216
       L 296 136
       L 376 136
       L 296 216
       L 216 296
       L 136 376
       L 216 376
       L 296 296
       L 376 216
       L 376 296
       L 296 376
       L 376 376"
    stroke="url(#zigzagGrad)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Ragdoll Sapphire Diamond Eyes (Positioned over the cheekbones with crisp dark bezels) -->
  <g>
    <!-- Left Eye -->
    <polygon points="142,248 184,226 220,256 178,278" fill="#0B0F17" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="156,249 183,235 206,254 179,268" fill="url(#sapphireGrad)"/>
    <circle cx="174" cy="246" r="4.5" fill="#F8FAFC"/>

    <!-- Right Eye -->
    <polygon points="370,248 328,226 292,256 334,278" fill="#0B0F17" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="356,249 329,235 306,254 333,268" fill="url(#sapphireGrad)"/>
    <circle cx="322" cy="246" r="4.5" fill="#F8FAFC"/>
  </g>

  <!-- Geometric Nose / DC Coefficient Anchor Triangle -->
  <polygon points="236,318 276,318 256,346" fill="#F97316" stroke="#0B0F17" stroke-width="4" stroke-linejoin="round"/>

  <!-- DC (0,0) and Nyquist (3,3) Terminal Nodes -->
  <circle cx="136" cy="136" r="10" fill="#10B981" stroke="#0B0F17" stroke-width="4"/>
  <circle cx="376" cy="376" r="10" fill="#F97316" stroke="#0B0F17" stroke-width="4"/>
</svg>
