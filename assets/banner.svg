<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="zzGrad" x1="60" y1="60" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="340" y1="80" x2="780" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="eyeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1196" height="336" rx="24" fill="url(#bannerBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="0" y1="68" x2="1200" y2="68"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="272" x2="1200" y2="272"/>
    <line x1="320" y1="0" x2="320" y2="340"/>
    <line x1="870" y1="0" x2="870" y2="340"/>
  </g>

  <!-- ==================== LEFT: RAGDOLL DCT ZIG-ZAG EMBLEM ==================== -->
  <g transform="translate(34, 24) scale(0.57)">
    <rect x="16" y="16" width="480" height="480" rx="104" fill="#0B0F17" stroke="#334155" stroke-width="4"/>

    <!-- 4x4 DCT Grid -->
    <g stroke="#1E293B" stroke-width="2" opacity="0.8">
      <line x1="136" y1="96" x2="136" y2="416"/>
      <line x1="216" y1="96" x2="216" y2="416"/>
      <line x1="296" y1="96" x2="296" y2="416"/>
      <line x1="376" y1="96" x2="376" y2="416"/>
      <line x1="96" y1="136" x2="416" y2="136"/>
      <line x1="96" y1="216" x2="416" y2="216"/>
      <line x1="96" y1="296" x2="416" y2="296"/>
      <line x1="96" y1="376" x2="416" y2="376"/>
    </g>

    <!-- Ragdoll Geometric Shield -->
    <path
      d="M 116 92 L 204 156 L 308 156 L 396 92 L 420 248 L 356 368 L 256 428 L 156 368 L 92 248 Z"
      fill="#111827"
      fill-opacity="0.85"
      stroke="#475569"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <polygon points="130,118 188,160 114,218" fill="#10B981" fill-opacity="0.22"/>
    <polygon points="382,118 324,160 398,218" fill="#F97316" fill-opacity="0.22"/>

    <!-- 4x4 DCT Zig-Zag Scan Path -->
    <path
      d="M 136 136 L 216 136 L 136 216 L 136 296 L 216 216 L 296 136 L 376 136 L 296 216 L 216 296 L 136 376 L 216 376 L 296 296 L 376 216 L 376 296 L 296 376 L 376 376"
      stroke="url(#zzGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
    />

    <!-- Sapphire Eyes -->
    <polygon points="142,248 184,226 220,256 178,278" fill="#0B0F17" stroke="#38BDF8" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="156,249 183,235 206,254 179,268" fill="url(#eyeGrad)"/>
    <circle cx="174" cy="246" r="5" fill="#F8FAFC"/>

    <polygon points="370,248 328,226 292,256 334,278" fill="#0B0F17" stroke="#38BDF8" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="356,249 329,235 306,254 333,268" fill="url(#eyeGrad)"/>
    <circle cx="322" cy="246" r="5" fill="#F8FAFC"/>

    <!-- Nose Anchor -->
    <polygon points="236,318 276,318 256,346" fill="#F97316" stroke="#0B0F17" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="136" cy="136" r="10" fill="#10B981" stroke="#0B0F17" stroke-width="4"/>
    <circle cx="376" cy="376" r="10" fill="#F97316" stroke="#0B0F17" stroke-width="4"/>
  </g>

  <!-- ==================== CENTER: WORDMARK & ARCHITECTURE PILLS ==================== -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <!-- Eyebrow tag -->
    <text x="352" y="76" fill="#10B981" font-size="13" font-weight="700" letter-spacing="3.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      FFMPEG REIMAGINED IN PURE SIMD RUST
    </text>

    <!-- Main Wordmark -->
    <text x="348" y="148" fill="url(#titleGrad)" font-size="68" font-weight="900" letter-spacing="-1.5">
      RAGDOLL
    </text>

    <!-- Tagline -->
    <text x="352" y="186" fill="#94A3B8" font-size="17" font-weight="500">
      Zero-C-FFI multimedia engine with 64B cache-aligned arenas, CLZ bitstreams &amp; explicit NEON/AVX2 kernels.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(352, 214)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="114" height="30" rx="6" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="1.2"/>
      <text x="57" y="19" fill="#34D399" text-anchor="middle">ZERO C FFI</text>

      <rect x="126" y="0" width="146" height="30" rx="6" fill="#0C4A6E" fill-opacity="0.55" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="199" y="19" fill="#7DD3FC" text-anchor="middle">AARCH64 NEON</text>

      <rect x="284" y="0" width="132" height="30" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <text x="350" y="19" fill="#E2E8F0" text-anchor="middle">X86_64 AVX2</text>

      <rect x="428" y="0" width="164" height="30" rx="6" fill="#431407" fill-opacity="0.55" stroke="#F97316" stroke-width="1.2"/>
      <text x="510" y="19" fill="#FDBA74" text-anchor="middle">64B ALIGNED ARENA</text>
    </g>

    <!-- libav* -> ragdoll-* mapping line -->
    <text x="352" y="284" fill="#64748B" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      libavutil &#8594; <tspan fill="#CBD5E1">ragdoll-core/simd</tspan>  ·  libswscale &#8594; <tspan fill="#CBD5E1">ragdoll-pix</tspan>  ·  libavformat &#8594; <tspan fill="#CBD5E1">ragdoll-format</tspan>  ·  libavcodec &#8594; <tspan fill="#CBD5E1">ragdoll-codec</tspan>
    </text>
  </g>

  <!-- ==================== RIGHT: APPLE M4 VS FFMPEG 9.0.2 TELEMETRY CARD ==================== -->
  <g transform="translate(894, 42)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="276" height="256" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="30" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.5">
      M4 NEON VS FFMPEG 9.0.2
    </text>
    <line x1="18" y1="42" x2="258" y2="42" stroke="#1E293B" stroke-width="1"/>

    <!-- Metric 1 -->
    <text x="18" y="68" fill="#CBD5E1" font-size="12" font-weight="600">Annex-B Scan</text>
    <text x="258" y="68" fill="#10B981" font-size="12" font-weight="700" text-anchor="end">32.6 GB/s (4.5x)</text>
    <rect x="18" y="76" width="240" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="76" width="228" height="6" rx="3" fill="#10B981"/>

    <!-- Metric 2 -->
    <text x="18" y="110" fill="#CBD5E1" font-size="12" font-weight="600">CRC-16 / CRC-32</text>
    <text x="258" y="110" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="end">3.09 GB/s (4.3x)</text>
    <rect x="18" y="118" width="240" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="118" width="214" height="6" rx="3" fill="#38BDF8"/>

    <!-- Metric 3 -->
    <text x="18" y="152" fill="#CBD5E1" font-size="12" font-weight="600">RBSP Unescape</text>
    <text x="258" y="152" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="end">10.7 GB/s (2.1x)</text>
    <rect x="18" y="160" width="240" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="160" width="186" height="6" rx="3" fill="#38BDF8"/>

    <!-- Metric 4 -->
    <text x="18" y="194" fill="#CBD5E1" font-size="12" font-weight="600">4K Plane SSIM</text>
    <text x="258" y="194" fill="#F97316" font-size="12" font-weight="700" text-anchor="end">10.1 Gpx/s (2.0x)</text>
    <rect x="18" y="202" width="240" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="202" width="180" height="6" rx="3" fill="#F97316"/>

    <!-- Metric 5 -->
    <text x="18" y="236" fill="#CBD5E1" font-size="12" font-weight="600">4K Plane SAD</text>
    <text x="258" y="236" fill="#10B981" font-size="12" font-weight="700" text-anchor="end">47.9 Gpx/s (1.5x)</text>
    <rect x="18" y="244" width="240" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="244" width="164" height="6" rx="3" fill="#10B981"/>
  </g>
</svg>
