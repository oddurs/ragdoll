[workspace]
resolver = "2"
members = [
    "crates/ragdoll-core",
    "crates/ragdoll-simd",
    "crates/ragdoll-pix",
    "crates/ragdoll-format",
    "crates/ragdoll-codec",
    "crates/ragdoll-pipeline",
    "crates/ragdoll-cli",
]
# Validation tooling is its own workspace, so its needs never enter this Cargo.lock (0062).
exclude = ["qa"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Oddur Sigurdsson <oddurs@github.com>"]
repository = "https://github.com/oddurs/ragdoll"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
