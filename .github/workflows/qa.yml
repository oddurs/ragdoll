name: QA corpus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ["qa/**", "crates/**", "Cargo.lock", ".github/workflows/qa.yml"]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  corpus:
    name: QA corpus (fetch & verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: The library lock file lists only the seven ragdoll crates
        run: |
          names=$(grep '^name = ' Cargo.lock | sed 's/name = //; s/"//g' | sort | tr '\n' ' ')
          echo "$names"
          test "$names" = "ragdoll-cli ragdoll-codec ragdoll-core ragdoll-format ragdoll-pipeline ragdoll-pix ragdoll-simd "

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust dependency & build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: qa

      # Tiers 2 and 3 are downloaded once per manifest: the key changes whenever an entry does.
      - name: Corpus cache (tiers 2 and 3)
        uses: actions/cache@v4
        with:
          path: qa/corpus/cache
          key: qa-corpus-${{ hashFiles('qa/corpus/manifest.toml') }}

      - name: Format, lints and tests (qa)
        working-directory: qa
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Fetch the corpus
        working-directory: qa
        run: cargo run --release -- corpus fetch

      - name: Verify every tier
        working-directory: qa
        run: cargo run --release -- corpus verify

      - name: Tier 1 regenerates byte-identically
        working-directory: qa
        run: cargo run --release -- corpus synth
