name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/brand/**", ".github/workflows/site.yml"]
  pull_request:
    branches: [main]
    paths: ["site/**", "assets/brand/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    defaults:
      run:
        working-directory: site
    env:
      # Served from https://<owner>.github.io/ragdoll/
      NEXT_PUBLIC_BASE_PATH: /ragdoll
      NEXT_PUBLIC_SITE_URL: https://oddurs.github.io/ragdoll
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
